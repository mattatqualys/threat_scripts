apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-access-t1552-003
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credential-access-t1552-003
  template:
    metadata:
      labels:
        app: credential-access-t1552-003
    spec:
      containers:
      - name: credential-access-t1552-003
        image: angelrita/base-ubuntu:latest
        command:
          - /bin/sh
          - -c
        args:
        - while true; do sleep 30; done;
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: true
          privileged: true
