apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-using-socks-proxy-t1572
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-using-socks-proxy-t1572
  template:
    metadata:
      labels:
        app: curl-using-socks-proxy-t1572
    spec:
      containers:
      - name: curl-using-socks-proxy-t1572
        image: angelrita/base-ubuntu:latest
        command:
          - /bin/sh
          - -c
        args:
        - while true; do sleep 30; done;
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: true
          privileged: true
